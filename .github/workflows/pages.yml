name: Website

# Publishes site/ (plus the screenshots in docs/images) to https://nikylogic.github.io/PhishGuard/
# The link checker's data (site/data/) is built here from the engine itself, and rebuilt every 6
# hours so the public phishing lists stay fresh.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/images/**", "phishguard/rules.py", "phishguard/intel.py", "phishguard/urltools.py",
            "phishguard/feeds.py", "phishguard/data/**", "scripts/build_site_data.py", "scripts/build_site_pages.py", ".github/workflows/pages.yml"]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the link checker's data
        run: |
          pip install $(grep -E '^(flask|tldextract|requests)==' requirements.txt)
          python scripts/build_site_data.py
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r site/. _site/
          rm -rf _site/_src
          mkdir -p _site/images
          cp docs/images/*.png _site/images/
          sed -i "s/__BUILT__/$(date -u +%F)/" _site/sitemap.xml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
