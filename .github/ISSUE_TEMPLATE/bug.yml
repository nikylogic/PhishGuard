name: Bug
description: Something in PhishGuard does not work.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen
      placeholder: |
        1. Click a link in Discord
        2. …
  - type: input
    id: version
    attributes:
      label: PhishGuard version (Settings → General, at the bottom)
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: The last lines of `%LOCALAPPDATA%\PhishGuard\launcher.log` and `server.log`. Remove anything private first.
      render: text
